{{ define "main" }}
<article>
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if .Params.subtitle }}
    <p class="post-subtitle">{{ .Params.subtitle }}</p>
    {{ end }}
    <hr class="post-header-divider" />
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}

        - paragraph [ref=f7e491]: All platform-specific probes fail gracefully. A missing GPU detector doesn’t crash the app.
        - heading "CLI Reference" [level=2] [ref=f7e492]
        - code [ref=f7e494]: "larpfetch # Default mode larpfetch -p NAME # Select profile larpfetch --profile NAME # Select profile (long form) larpfetch --distro NAME # LARP as a specific distro larpfetch --logo NAME # Pick a specific logo by name larpfetch --small # Use small ASCII art larpfetch --cols N # Force column width for logo larpfetch --list-logos # List all available logos larpfetch --list-logos --search ubuntu # Search logos larpfetch --real-shit # Real system info only larpfetch --json # Output as JSON larpfetch --json --with-sources # JSON with per-field provenance larpfetch --diff-real # Show only fields that differ from real larpfetch --show-sources # Show where each value came from larpfetch --shell-info # Show shell version larpfetch --gpu-info # Show GPU driver details larpfetch --disk-info # Show per-disk breakdown ($HOME disk by default) larpfetch --disk-info /data # Show only the /data disk larpfetch --disk-info all # Include virtual mounts larpfetch --minimal # Short field preset larpfetch --compact # Standard fields, no logo larpfetch --full # All available fields larpfetch --export-profile [NAME] # Export real system as a shareable profile larpfetch --profile-file PATH # Load a standalone profile file larpfetch --inspect-profile NAME|PATH # Inspect a profile or profile file larpfetch --list-profiles # List all profiles larpfetch --show-config # Show current config larpfetch --generate-config # Print a starter config larpfetch --check-config # Validate the config file larpfetch --config /path/to/config.toml # Custom config path larpfetch --set key=value # Override a field (repeatable) larpfetch --color # Force color output larpfetch --no-color # Disable color output larpfetch --version # Show version larpfetch --help # Show help"
        - heading "Sharing profiles" [level=2] [ref=f7e495]
        - paragraph [ref=f7e496]: Export your real system as a standalone profile, then share the file. Profiles are data-only TOML — loading one never executes code.
        - code [ref=f7e499]:
          - generic [ref=f7e500]: "larpfetch --export-profile myrig > myrig.toml # capture your real system"
          - generic [ref=f7e502]: "larpfetch --profile-file myrig.toml # someone else LARPs as your rig"
          - generic [ref=f7e504]: "larpfetch --inspect-profile myrig.toml # see what a profile contains"
